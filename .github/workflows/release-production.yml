name: Production Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish-production:
    name: Firebase and Google Play production
    environment: production-release
    permissions: { contents: read }
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.2
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Verify release automation tests
        run: |
          ruby test/release_configuration_test.rb
          ruby test/production_release_test.rb

      - name: Validate production release identity
        env:
          RELEASE_REF: ${{ github.ref }}
          EXPECTED_VERSION_CODE: "13"
          EXPECTED_VERSION_NAME: "3.0.2"
        shell: bash
        run: |
          set -euo pipefail
          case "$RELEASE_REF" in
            refs/heads/release/3.0.2_13|refs/tags/v3.0.2) ;;
            *)
              echo "::error::Production 3.0.2 (13) can run only from release/3.0.2_13 or tag v3.0.2."
              exit 1
              ;;
          esac
          actual_version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)[[:space:]]*$/\1/p' app/build.gradle.kts)"
          actual_version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"[[:space:]]*$/\1/p' app/build.gradle.kts)"
          test "$actual_version_code" = "$EXPECTED_VERSION_CODE"
          test "$actual_version_name" = "$EXPECTED_VERSION_NAME"

      - name: Reconstruct upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathbrainer-upload.jks"
          test -s "$RUNNER_TEMP/mathbrainer-upload.jks"

      - name: Build signed production AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/mathbrainer-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        run: bundle exec fastlane android build_release_bundle

      - name: Verify production AAB
        shell: bash
        run: |
          set -euo pipefail
          aab_path="app/build/outputs/bundle/release/app-release.aab"
          checksum_path="${aab_path}.sha256"
          test -s "$aab_path"
          test -s app/build/outputs/mapping/release/mapping.txt
          verification_output="$(jarsigner -verify -verbose -certs "$aab_path" 2>&1)"
          printf '%s\n' "$verification_output"
          printf '%s\n' "$verification_output" | grep -Eq '^jar verified\.$'
          if printf '%s\n' "$verification_output" | grep -Eiq 'jar is unsigned|unsigned entr(y|ies)'; then
            echo "::error::Production AAB contains unsigned content."
            exit 1
          fi
          sha256sum "$aab_path" > "$checksum_path"

      - name: Validate Firebase destination
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        shell: bash
        run: |
          set -euo pipefail
          test "$FIREBASE_APP_ID" = "1:632111455840:android:952c21d10fcd75073aed05"
          test "$FIREBASE_TESTER_GROUPS" = "owner-testers"

      - name: Write Firebase credentials
        env:
          FIREBASE_APP_DISTRIBUTION_JSON_KEY: ${{ secrets.FIREBASE_APP_DISTRIBUTION_JSON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$FIREBASE_APP_DISTRIBUTION_JSON_KEY"
          printf '%s' "$FIREBASE_APP_DISTRIBUTION_JSON_KEY" > "$RUNNER_TEMP/firebase-app-distribution.json"
          ruby -rjson -e '
            credentials = JSON.parse(File.read(ARGV.fetch(0)))
            abort("Firebase credentials must be a service-account key for e-rampart-226407.") unless
              credentials["type"] == "service_account" &&
              credentials["project_id"] == "e-rampart-226407" &&
              !credentials["private_key"].to_s.empty?
          ' "$RUNNER_TEMP/firebase-app-distribution.json"

      - name: Distribute production AAB to Firebase
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          FIREBASE_AAB_PATH: ${{ github.workspace }}/app/build/outputs/bundle/release/app-release.aab
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-app-distribution.json
        run: bundle exec fastlane android distribute_firebase

      - name: Publish production release to Google Play
        env:
          PLAY_PRODUCTION_JSON_KEY: ${{ secrets.PLAY_PRODUCTION_JSON_KEY }}
        run: bundle exec fastlane android production_release

      - name: Confirm production AAB hash is unchanged
        run: sha256sum --check app/build/outputs/bundle/release/app-release.aab.sha256

      - name: Remove temporary release credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mathbrainer-upload.jks"
          rm -f "$RUNNER_TEMP/firebase-app-distribution.json"
