name: Android CI

on:
  pull_request:
  push:
    branches: [develop, master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_ARGS: --no-daemon --stacktrace

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew $GRADLE_ARGS :app:testDebugUnitTest

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run lint and merged-manifest checks
        run: ./gradlew $GRADLE_ARGS :app:lintDebug :app:verifyReleaseManifest
      - name: Upload non-sensitive lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 7

  debug-build:
    name: debug-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew $GRADLE_ARGS :app:assembleDebug

  phone-smoke:
    name: phone-${{ matrix.locale }}-api-${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - locale: en-US
            api: 26
          - locale: it-IT
            api: 36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run phone smoke journey
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            locale='${{ matrix.locale }}'
            language="${locale%%-*}"
            country="${locale##*-}"
            adb root
            adb wait-for-device
            adb shell settings put system system_locales "$locale"
            adb shell setprop persist.sys.locale "$locale"
            adb shell setprop persist.sys.language "$language"
            adb shell setprop persist.sys.country "$country"
            adb shell setprop ctl.restart zygote
            adb wait-for-device
            until adb shell pm path android >/dev/null 2>&1; do sleep 2; done
            test "$(adb shell getprop persist.sys.locale | tr -d '\r')" = "$locale"
            ./gradlew $GRADLE_ARGS :app:installDebug
            if adb shell cmd locale help >/dev/null 2>&1; then
              adb shell cmd locale set-app-locales eu.indiewalkabout.mathbrainer --locales "$locale"
            fi
            ./gradlew $GRADLE_ARGS :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=eu.indiewalkabout.mathbrainer.ReleaseSmokeTest \
              -Pandroid.testInstrumentationRunnerArguments.expectedLocale="$locale"

  tablet-smoke:
    name: ${{ matrix.profile-name }}-${{ matrix.locale }}-api-${{ matrix.api }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile-name: tablet-7, profile: "Nexus 7", locale: en-US, api: 26 }
          - { profile-name: tablet-7, profile: "Nexus 7", locale: it-IT, api: 36 }
          - { profile-name: tablet-10, profile: "Nexus 10", locale: en-US, api: 26 }
          - { profile-name: tablet-10, profile: "Nexus 10", locale: it-IT, api: 36 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run nightly tablet smoke journey
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            locale='${{ matrix.locale }}'
            language="${locale%%-*}"
            country="${locale##*-}"
            adb root
            adb wait-for-device
            adb shell settings put system system_locales "$locale"
            adb shell setprop persist.sys.locale "$locale"
            adb shell setprop persist.sys.language "$language"
            adb shell setprop persist.sys.country "$country"
            adb shell setprop ctl.restart zygote
            adb wait-for-device
            until adb shell pm path android >/dev/null 2>&1; do sleep 2; done
            test "$(adb shell getprop persist.sys.locale | tr -d '\r')" = "$locale"
            ./gradlew $GRADLE_ARGS :app:installDebug
            if adb shell cmd locale help >/dev/null 2>&1; then
              adb shell cmd locale set-app-locales eu.indiewalkabout.mathbrainer --locales "$locale"
            fi
            ./gradlew $GRADLE_ARGS :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=eu.indiewalkabout.mathbrainer.ReleaseSmokeTest \
              -Pandroid.testInstrumentationRunnerArguments.expectedLocale="$locale"

  instrumentation-smoke:
    name: instrumentation-smoke
    if: always()
    needs: [phone-smoke, tablet-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce smoke results
        env:
          PHONE_RESULT: ${{ needs.phone-smoke.result }}
          TABLET_RESULT: ${{ needs.tablet-smoke.result }}
        run: |
          test "$PHONE_RESULT" = success
          test "$TABLET_RESULT" = success || test "$TABLET_RESULT" = skipped

  release-bundle:
    name: release-bundle
    needs: [unit-tests, lint, debug-build, instrumentation-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Clearly non-production, non-Google-sample IDs for compilation proof only.
      ADMOB_APP_ID: ca-app-pub-0000000000000000~0000000000
      ADMOB_BANNER_ID: ca-app-pub-0000000000000000/0000000000
      KEYSTORE_FILE: ${{ runner.temp }}/mathbrainer-ci-validation.jks
      KEY_ALIAS: mathbrainer-ci-validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Create ephemeral CI-only signing key
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$password" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE_FILE" \
            -storepass "$password" -keypass "$password" -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Math Brainer CI Validation,OU=CI,O=Non-Production,C=XX"
      - name: Build and inspect minified CI-only bundle
        run: |
          ./gradlew $GRADLE_ARGS :app:bundleRelease :app:verifyReleaseManifest
          ./gradlew $GRADLE_ARGS :app:dependencies
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s app/build/outputs/mapping/release/resources.txt
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
      - name: Smoke minified release APK
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            locale='en-US'
            adb root
            adb wait-for-device
            adb shell settings put system system_locales "$locale"
            adb shell setprop persist.sys.locale "$locale"
            adb shell setprop persist.sys.language en
            adb shell setprop persist.sys.country US
            adb shell setprop ctl.restart zygote
            adb wait-for-device
            until adb shell pm path android >/dev/null 2>&1; do sleep 2; done
            test "$(adb shell getprop persist.sys.locale | tr -d '\r')" = "$locale"
            ./gradlew $GRADLE_ARGS -Pandroid.testBuildType=release :app:installRelease
            if adb shell cmd locale help >/dev/null 2>&1; then
              adb shell cmd locale set-app-locales eu.indiewalkabout.mathbrainer --locales "$locale"
            fi
            ./gradlew $GRADLE_ARGS -Pandroid.testBuildType=release :app:connectedReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=eu.indiewalkabout.mathbrainer.ReleaseSmokeTest \
              -Pandroid.testInstrumentationRunnerArguments.expectedLocale="$locale"
